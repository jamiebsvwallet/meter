version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7-alpine
    container_name: plumbing-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: plumbing
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plumbing-network

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plumbing-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://root:password@mongodb:27017/plumbing?authSource=admin
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      BSV_NETWORK: testnet
      JWT_SECRET: dev-secret-key
      LOG_LEVEL: debug
      CORS_ORIGIN: http://localhost:3000,http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - plumbing-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Development Server (optional - usually run separately)
  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: plumbing-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     REACT_APP_API_URL: http://localhost:3001
  #   depends_on:
  #     - backend
  #   networks:
  #     - plumbing-network

volumes:
  mongodb_data:
    driver: local

networks:
  plumbing-network:
    driver: bridge
